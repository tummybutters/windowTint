<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsidian Autoworks Ad Image Assets</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    main {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      padding: 24px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main aria-label="Google Ads image assets">
    <img src="/ads-assets/bmw-m4-01-square-1200.jpg" width="1200" height="1200" alt="White BMW with ceramic window tint">
    <img src="/ads-assets/bmw-m4-02-square-1200.jpg" width="1200" height="1200" alt="White BMW tint detail">
    <img src="/ads-assets/cadillac-lyriq-01-square-1200.jpg" width="1200" height="1200" alt="Black Cadillac with ceramic window tint">
    <img src="/ads-assets/lexus-gx-01-square-1200.jpg" width="1200" height="1200" alt="Lexus SUV with ceramic window tint">
    <img src="/ads-assets/toyota-tacoma-01-square-1200.jpg" width="1200" height="1200" alt="Toyota Tacoma with ceramic window tint">
    <img src="/ads-assets/bmw-m4-01-landscape-1200x628.jpg" width="1200" height="628" alt="White BMW landscape ceramic tint photo">
    <img src="/ads-assets/cadillac-lyriq-01-landscape-1200x628.jpg" width="1200" height="628" alt="Black Cadillac landscape ceramic tint photo">
    <img src="/ads-assets/toyota-tacoma-01-landscape-1200x628.jpg" width="1200" height="628" alt="Toyota Tacoma landscape ceramic tint photo">
  </main>
</body>
</html>
