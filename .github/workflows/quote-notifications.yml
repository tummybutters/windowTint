name: Read-only landing speed delivery audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect saved commercial attribution and delivery
        env:
          QUOTE_RETRY_SECRET: ${{ secrets.QUOTE_RETRY_SECRET }}
        run: |
          python3 - <<'PYCODE'
          import json,os,urllib.request
          base='https://www.obsidianautoworksoc.com/api/quote-notification-retry'
          def get(q):
              req=urllib.request.Request(base+q,headers={'Authorization':'Bearer '+os.environ['QUOTE_RETRY_SECRET']})
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          for lead_id in ['287e48bf-4946-4092-8e16-3604774ffd21', '0a933233-c70e-4ec0-929c-b1035120346c', 'e511266a-3a26-418f-9887-cfa9997358ac']:
              lead=get('?lead_id='+lead_id)['lead']
              print('DELIVERY_AUDIT '+json.dumps({k:lead.get(k) for k in ['id','notification_state','notification_delivery_state','notification_error','notification_delivery_error','crm_state','experiment_id','experiment_variant']}))
              if lead.get('notification_delivery_state') not in ['delivered','read']:raise SystemExit('Delivery not confirmed; investigate without resending')
          PYCODE
