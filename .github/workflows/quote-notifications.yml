name: Quote alert delivery
on: {workflow_dispatch: {}}
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read current delivery and attribution aggregates
        env:
          QUOTE_RETRY_SECRET: ${{ secrets.QUOTE_RETRY_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,collections,datetime
          from zoneinfo import ZoneInfo
          BASE='https://www.obsidianautoworksoc.com/api/'
          headers={'Authorization':'Bearer '+os.environ['QUOTE_RETRY_SECRET']}
          def request(path):
           with urllib.request.urlopen(urllib.request.Request(BASE+path,headers=headers),timeout=55) as r:return json.load(r)
          delivery=[];offset=0
          while True:
           d=request('quote-notification-retry?report=delivery&start=2026-11-03&end=2026-11-12&offset='+str(offset));delivery+=d['leads']
           if d['next_offset'] is None:break
           offset=d['next_offset']
          print(json.dumps({'delivery_count':len(delivery),'delivered':sum(x['sms_status'] in ['delivered','read'] for x in delivery),'fresh_provider':sum(bool(x['fresh_provider_read']) for x in delivery),'recipient_matches_elle':d['recipient_matches_elle'],'delivery_issues':[{'quote_id':x['quote_id'],'status':x['sms_status']} for x in delivery if x['sms_status'] not in ['delivered','read']]}))
          f=request('quote-notification-retry?report=funnel&start=2026-11-03&end=2026-11-12')
          linked={x['quote_id']:x['contact_id'] for x in f['crm_evidence'] if x['kind']=='contact'}
          print(json.dumps({'server_saved_quotes':len(f['leads']),'verified_requests':len(linked),'verified_customers':len(set(linked.values())),'unmatched_quotes':[{k:q.get(k) for k in ['quote_id','received_at','lead_kind','page_path','crm_state']} for q in f['leads'] if q['quote_id'] not in linked],'truncated':f['leads_truncated'] or f['events_truncated'],'form_test_summary':f.get('form_test_summary')}))
          def date(v):return datetime.datetime.fromisoformat(v.replace('Z','+00:00')).astimezone(ZoneInfo('America/Los_Angeles')).date().isoformat()
          cohorts={}
          for q in f['leads']:
           a=q.get('attribution') or {};key=(date(q['received_at']),a.get('campaignid') or a.get('campaign_id') or a.get('utm_campaign') or 'unknown',a.get('experiment_variant','unknown'))
           c=cohorts.setdefault(key,{'requests':0,'contacts':set()});c['requests']+=1
           if q['quote_id'] in linked:c['contacts'].add(linked[q['quote_id']])
          print(json.dumps({'today_form_errors':[{'time':e['event_time'],'campaign':(e.get('attribution') or {}).get('campaignid'),'form':(e.get('attribution') or {}).get('form_variant'),'field':(e.get('payload') or {}).get('field_name'),'reason':(e.get('payload') or {}).get('error_reason')} for e in f['events'] if date(e['event_time'])=='2026-11-12' and e['event_name'] in ['quote_validation_error','quote_submit_error']],'today_saved_attribution':[{'quote_id':q['quote_id'],'received_at':q['received_at'],'attribution':{k:(q.get('attribution') or {}).get(k) for k in ['first_seen_at','touch_at','form_exposed_at','form_variant','form_test_arm','device_category','ad_click_device','landing_page','session_landing_page','attribution_version']}} for q in f['leads'] if date(q['received_at'])=='2026-11-12']}))
          print(json.dumps({'cohorts':[{'date':k[0],'campaign':k[1],'arm':k[2],'requests':v['requests'],'verified_customers':len(v['contacts'])} for k,v in cohorts.items()]}))
          ev=collections.Counter()
          for e in f['events']:
           if date(e['event_time'])!='2026-11-12':continue
           a=e.get('attribution') or {};ev[(a.get('campaignid') or a.get('campaign_id') or a.get('utm_campaign') or 'unknown',e['event_name'])]+=1
          print(json.dumps({'today_server_events':[{'campaign':k[0],'event':k[1],'count':v} for k,v in ev.items()],'crm_outcomes':[{'kind':r['kind'],'status':r['status'],'occurred_at':r['occurred_at'],'amount_minor':r.get('amount_minor')} for r in f['crm_evidence'] if r['kind']!='contact']}))
          PY
