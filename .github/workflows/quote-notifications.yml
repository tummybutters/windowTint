name: Read-only October 6 lead delivery audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read individual saved lead delivery states
        env:
          QUOTE_RETRY_SECRET: ${{ secrets.QUOTE_RETRY_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          leads = {
              'Leronica': '55210409-9813-4e7f-b7c3-6282ae660e44',
              'Guillermo': '2ed44a6a-5f5c-4c38-afe5-328767917073',
              'Joel': 'cefacb41-3ed3-4bdc-b4ae-11713a901143',
          }
          failed = False
          for name, lead_id in leads.items():
              request = urllib.request.Request(
                  'https://www.obsidianautoworksoc.com/api/quote-notification-retry?lead_id=' + lead_id,
                  headers={'Authorization': 'Bearer ' + os.environ['QUOTE_RETRY_SECRET']})
              with urllib.request.urlopen(request, timeout=45) as response:
                  lead = json.load(response)['lead']
              keys = ['id','received_at','notification_state','notification_attempts','notification_provider_id','notification_delivery_state','notification_error','notification_delivery_error','crm_state']
              result = {'name':name, **{key:lead.get(key) for key in keys}}
              print('LEAD_AUDIT ' + json.dumps(result))
              if lead.get('notification_delivery_state') not in ['delivered','read']:
                  failed = True
          if failed:
              raise SystemExit('One or more individual alerts require delivery review')
          PY
