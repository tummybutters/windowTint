name: Quote request evidence repair
on: {workflow_dispatch: {}}
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Link verified existing requests and read delivery evidence
        env:
          QUOTE_RETRY_SECRET: ${{ secrets.QUOTE_RETRY_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          headers={'Authorization':'Bearer '+os.environ['QUOTE_RETRY_SECRET'],'Content-Type':'application/json'}
          def request(path,body=None):
           req=urllib.request.Request('https://www.obsidianautoworksoc.com/api/'+path,headers=headers,data=json.dumps(body).encode() if body is not None else None)
           with urllib.request.urlopen(req,timeout=55) as r:return json.load(r)
          records=[{'kind': 'contact', 'record_id': '4496075', 'contact_id': '4496075', 'quote_id': 'ec6c5993-d1de-4a70-8b54-309daea0c7bf', 'occurred_at': '2026-11-13T03:00:00Z', 'status': 'verified'}]
          result=request('crm-attribution',{'records':records})
          print(json.dumps({'existing_requests_linked':len(result['accepted'])}))
          f=request('quote-notification-retry?report=funnel&start=2026-11-03&end=2026-11-12')
          linked={x['quote_id']:x['contact_id'] for x in f['crm_evidence'] if x['kind']=='contact'}
          ids=[r['quote_id'] for r in records]
          print(json.dumps({'request_verified':all(linked.get(i)=='4496075' for i in ids),'saved_requests':len(f['leads']),'verified_requests':len(linked),'distinct_verified_contacts':len(set(linked.values())),'unmatched_requests':len([q for q in f['leads'] if q['quote_id'] not in linked]),'form_test_summary':f.get('form_test_summary'),'truncated':f['leads_truncated'] or f['events_truncated']}))
          leads=[];offset=0
          while True:
           d=request('quote-notification-retry?report=delivery&start=2026-11-03&end=2026-11-12&offset='+str(offset));leads+=d['leads']
           if d['next_offset'] is None:break
           offset=d['next_offset']
          print(json.dumps({'delivery_requests':len(leads),'delivered_or_read':sum(x['sms_status'] in ['delivered','read'] for x in leads),'fresh_provider_confirmations':sum(bool(x['fresh_provider_read']) for x in leads),'recipient_matches_elle':d['recipient_matches_elle'],'affected_request_sms':[{'quote_id':x['quote_id'],'sms_status':x['sms_status']} for x in leads if x['quote_id'] in ids],'delivery_issues':[{'quote_id':x['quote_id'],'status':x['sms_status']} for x in leads if x['sms_status'] not in ['delivered','read']]}))
          PY
