name: Quote alert delivery
on: {workflow_dispatch: {}}
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read existing lead delivery states only
        env:
          QUOTE_RETRY_SECRET: ${{ secrets.QUOTE_RETRY_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          ids=['f0235e20-8fac-465b-8bf3-1fcb7c0a4f60', '15c1e002-6a66-4277-bea3-651df476a75b', '3ec5e480-b7ad-45c1-b1f2-a764559eb8eb', '7a71f603-b4da-4dca-8344-8e81f5405946', '6e3e4e00-8f28-4f85-9b31-7ea4638fbef9', 'f4ffb302-da1f-4620-a265-1cb574ca89dc', 'f9e0e55e-76ab-47e3-87d7-946fe9e7ef39', '8ae4218f-faab-4ff3-8582-66cd5e84f438', '2e18eefc-bfa4-4f40-8416-e95e3be014c0', '235747a1-0fc8-4a82-8c28-0b5e31b660e5', '824414e3-acf4-43e5-95a1-4748a8567c9c', '94e47dd9-4c5a-4f75-a0bb-a5fc136c0242', '4b971264-0280-43df-aded-7133ff60c11f', '138c8fce-d1eb-4751-8a45-bc5b5f4e8c79', '22c92e3d-49af-4af8-89c7-7177fe1b8754']
          for lead_id in ids:
           request=urllib.request.Request('https://www.obsidianautoworksoc.com/api/quote-notification-retry?lead_id='+lead_id,headers={'Authorization':'Bearer '+os.environ['QUOTE_RETRY_SECRET']})
           with urllib.request.urlopen(request,timeout=45) as response: lead=json.load(response)['lead']
           print(json.dumps({k:lead.get(k) for k in ['id','received_at','notification_state','notification_delivery_state','crm_state']}))
          PY
